name: Release CLI

# The CLI owns the `v*.*.*` tag namespace. The web app is deploy-on-push and is
# never tagged. The timvisee/send fork this was rewritten from left 99 tags in
# local clones, spanning v0.1.0-v3.4.9 rather than only the v3.4.x range an
# earlier version of this comment claimed — enough to collide with every
# version a new CLI would plausibly pick. None were ever pushed to this repo,
# and they were deleted locally before v0.1.0, so the namespace starts empty.
# If the app ever wants release tags it takes an `app-v*` prefix.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to (re)build
        required: true

permissions:
  contents: write

jobs:
  # A workflow_dispatch input reaches `ref:` on checkout, so it is validated
  # before anything consumes it rather than interpolated directly. The pattern
  # is the same one bunli-releaser enforces, so this also fails fast on a tag
  # shape the release step would reject later.
  resolve:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.check.outputs.ref }}
    steps:
      - id: check
        env:
          REQUESTED: ${{ github.event.inputs.tag }}
          PUSHED: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${REQUESTED:-$PUSHED}"
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Refusing tag '$TAG': releases must be vX.Y.Z." >&2
            exit 1
          fi
          printf 'ref=%s\n' "$TAG" >> "$GITHUB_OUTPUT"

  binaries:
    name: Binaries and checksums
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # Required, and easy to lose: `bun install --frozen-lockfile` installs
      # only the current platform's packages. @bunli/core pulls OpenTUI, whose
      # native library ships as a per-platform package, and bun refuses to
      # extract packages whose os/cpu do not match the host — so cross-compiling
      # to darwin or windows cannot resolve them. Verified that this does not
      # touch bun.lock, so it does not defeat lockfile pinning.
      - name: Install every platform's runtime
        run: bun install --os '*' --cpu '*'

      # `--targets all` resolves, in bunli's own source, to exactly the five
      # directories the packaging step walks below. A single-target build would
      # write a flat dist/sendfm instead of dist/<target>/sendfm.
      - name: Build all targets
        run: cd apps/cli && bun run build:all

      # Packaging is done here rather than by a third-party action.
      # AryaLabsHQ/bunli-releaser was the obvious fit and is what this workflow
      # originally called, but its action.yml fails to parse as YAML at every
      # commit it has ever had (an unquoted `Bunli CLIs: build` in the
      # top-level `description`), so GitHub cannot load it at any ref, and it
      # publishes no tags to pin besides. The work it would have done is a
      # tar, a sha256sum and an upload.
      #
      # THE ASSET NAMING BELOW IS A CONTRACT WITH THREE INDEPENDENT CONSUMERS:
      #   - apps/frontend/public/install.sh  (served at https://send.fm/install.sh)
      #   - apps/cli/src/commands/update.ts  (`assetNameFor`, the self-updater)
      #   - the Homebrew formula, once that ships
      # All three build `sendfm-<version>-<os>-<arch>.<ext>` and expect the
      # executable at the ARCHIVE ROOT, not under a directory. Renaming an
      # asset silently breaks `curl | sh` and `sendfm update` for everyone who
      # already installed — the old clients are already in the wild.
      - name: Package archives and checksums
        env:
          TAG: ${{ needs.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          mkdir -p "$GITHUB_WORKSPACE/release-assets"

          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 windows-x64; do
            case "$target" in
              windows-*) exe=sendfm.exe ;;
              *)         exe=sendfm ;;
            esac

            src="apps/cli/dist/$target/$exe"
            if [ ! -f "$src" ]; then
              echo "::error::missing build output for $target: $src"
              exit 1
            fi
            chmod +x "$src"

            # -C so the executable lands at the archive root; both the installer
            # and the self-updater look for ./sendfm immediately after unpacking.
            case "$target" in
              windows-*)
                ( cd "apps/cli/dist/$target" \
                  && zip -qX "$GITHUB_WORKSPACE/release-assets/sendfm-$VERSION-$target.zip" "$exe" )
                ;;
              *)
                tar -czf "$GITHUB_WORKSPACE/release-assets/sendfm-$VERSION-$target.tar.gz" \
                    -C "apps/cli/dist/$target" "$exe"
                ;;
            esac
          done

          # sha256sum's default `<hash>  <name>` output is what both consumers
          # parse: install.sh greps for a trailing " <asset>" and update.ts
          # splits each line on whitespace. Bare names, no ./ prefix, and the
          # glob deliberately excludes checksums.txt itself.
          cd "$GITHUB_WORKSPACE/release-assets"
          sha256sum sendfm-* > checksums.txt
          cat checksums.txt

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"

          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          `sendfm` is the command-line client for send.fm — send and receive
          end-to-end encrypted files from a terminal, against any Bolter instance.

          ## Install

          ```sh
          curl -fsSL https://send.fm/install.sh | sh
          ```

          The installer picks the binary for your platform, verifies it against
          `checksums.txt` below, and installs it somewhere writable on your
          `PATH`. `SENDFM_INSTALL_DIR` chooses the location and `SENDFM_VERSION`
          pins a version. On Windows, take the `windows-x64.zip` asset directly.

          Homebrew and npm packages follow shortly. Already installed? `sendfm update`.

          ## Verifying by hand

          ```sh
          sha256sum -c checksums.txt --ignore-missing
          ```
          NOTES

          # Re-running a tag must not fail on a release that already exists —
          # the whole point of the workflow_dispatch input is rebuilding one.
          # `--clobber` replaces assets rather than skipping them, so a rerun
          # after a build fix actually ships the fixed binary.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing its assets."
          else
            gh release create "$TAG" \
              --title "sendfm $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --verify-tag
          fi

          gh release upload "$TAG" "$GITHUB_WORKSPACE"/release-assets/* --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'

  homebrew:
    name: Homebrew tap
    needs: [resolve, binaries]
    # Dormant until `HOMEBREW_TAP` (e.g. "slingshot/homebrew-tap") is set in the
    # repository variables, alongside a `HOMEBREW_TAP_TOKEN` secret. Gated on the
    # variable and not the secret because the `secrets` context is not available
    # in a job-level `if:` — `secrets.X != ''` reads as empty and never runs.
    if: vars.HOMEBREW_TAP != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # No `bun install`: render-formula.ts imports nothing, so the job needs
      # only a Bun runtime. Keeps this well under a minute.
      - name: Render the formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          # Read checksums from the release the previous job just published,
          # rather than rebuilding the binaries and hashing those. A rebuild is
          # not bit-identical (Bun's compiled output is not reproducible), so
          # hashing a second build would publish digests that do not match the
          # assets people actually download.
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern checksums.txt \
            --dir "$RUNNER_TEMP"
          bun run apps/cli/scripts/render-formula.ts "$TAG" "$RUNNER_TEMP/checksums.txt" \
            > "$RUNNER_TEMP/sendfm.rb"
          cat "$RUNNER_TEMP/sendfm.rb"

      # A separate checkout of the tap: GITHUB_TOKEN is scoped to this
      # repository and cannot push to another one, whatever `permissions:` say.
      - name: Check out the tap
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.HOMEBREW_TAP }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Commit the formula
        env:
          TAG: ${{ needs.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/sendfm.rb" tap/Formula/sendfm.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Re-running a tag must not fail on an unchanged formula, and
          # `git commit` exits non-zero with nothing staged.
          if git diff --quiet -- Formula/sendfm.rb; then
            echo "Formula already at $TAG; nothing to commit."
            exit 0
          fi
          git add Formula/sendfm.rb
          git commit -m "chore: sendfm ${TAG#v}" \
            -m "Generated from ${GITHUB_REPOSITORY}@${TAG} by apps/cli/scripts/render-formula.ts."
          git push

  npm:
    name: npm
    needs: [resolve, binaries]
    # After the release exists, so a failed binary build does not leave npm
    # advertising a version with nothing behind it.
    #
    # Dormant until `PUBLISH_NPM` is set to "true" in the repository variables.
    # The first release ships via GitHub + install.sh only, and an ungated job
    # with no NPM_TOKEN would publish nothing and put a red X on the release it
    # was meant to accompany. A variable rather than a code change so enabling
    # npm later is: add the NPM_TOKEN secret, set the variable, retag.
    if: vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Install every platform's runtime
        run: bun install --os '*' --cpu '*'

      - name: Build all targets
        run: cd apps/cli && bun run build:all

      # One package per platform plus a tiny launcher that depends on all of
      # them optionally. npm installs only the matching one, so `npm i -g
      # sendfm` gets a native binary without needing Bun — and without a
      # postinstall script that downloads things, which breaks offline installs
      # and is a supply-chain liability.
      - name: Publish
        run: cd apps/cli && bun run scripts/publish-npm.ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
