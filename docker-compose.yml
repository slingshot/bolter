services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        - VITE_APP_TITLE=${VITE_APP_TITLE:-Slingshot Send}
        - VITE_APP_DESCRIPTION=${VITE_APP_DESCRIPTION:-Encrypt and send files with a link that automatically expires.}
        # Baked into the bundle and into instance.json. The compose frontend
        # proxies /api/ to the backend, so same-origin is the right default.
        - VITE_API_URL=${VITE_API_URL:-/api}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - bolter-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3001
      - BASE_URL=${BASE_URL:-http://localhost:3001}
      # CORS is fail-closed in production; the frontend origin must be allowed
      # explicitly (the compose frontend is published on :3000).
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_USE_PATH_STYLE_ENDPOINT=${S3_USE_PATH_STYLE_ENDPOINT:-true}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3001/health/ready').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - bolter-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bolter-network
    restart: unless-stopped

  # Integration-test S3. Not started by default — `docker compose up` runs the
  # app against whatever real bucket .env points at. Bring it up with:
  #   docker compose --profile test up -d minio minio-init redis
  #
  # It exists because nothing in this repo exercised a real S3 before: the
  # Playwright suite mocks the API at the page level, so multipart assembly,
  # ETag round-trips, Range requests and R2's EntityTooSmall/InvalidPart
  # rejections were only ever tested in production.
  minio:
    image: minio/minio:latest
    profiles: ["test"]
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${TEST_S3_ACCESS_KEY:-bolter-test}
      - MINIO_ROOT_PASSWORD=${TEST_S3_SECRET_KEY:-bolter-test-secret}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - bolter-network

  # Creates the bucket, then exits. Separate from `minio` so the server's
  # healthcheck is what gates readiness, not a bucket that may already exist.
  minio-init:
    image: minio/mc:latest
    profiles: ["test"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${TEST_S3_ACCESS_KEY:-bolter-test} ${TEST_S3_SECRET_KEY:-bolter-test-secret} &&
      mc mb --ignore-existing local/${TEST_S3_BUCKET:-bolter-test} &&
      echo 'bucket ready'
      "
    networks:
      - bolter-network

networks:
  bolter-network:
    driver: bridge

volumes:
  redis-data:
